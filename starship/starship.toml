"$schema" = 'https://starship.rs/config-schema.json'
# ~/.config/starship.toml — géré par ~/code/dotfiles.
# Prompt simple, ASCII uniquement, sans fond ni police spéciale :
#   user@hôte:chemin (branche *+?) [jobs] [batt] [code d'erreur] $
# L'hôte n'apparaît qu'en ssh, la batterie que sous 75 %.

add_newline = false
command_timeout = 500

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$jobs\
$battery\
$status\
$character"""

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "bold green"
format = "[@$hostname]($style)"

[directory]
style = "bold blue"
format = ":[$path]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncation_symbol = ".../"
truncate_to_repo = false
read_only = " (ro)"
read_only_style = "red"

[git_branch]
symbol = ""
style = "yellow"
format = " [\\($branch]($style)"

[git_status]
style = "yellow"
format = "[( $all_status$ahead_behind)\\)]($style)"
ahead = ">${count}"
behind = "<${count}"
diverged = ">${ahead_count}<${behind_count}"
modified = "*"
staged = "+"
untracked = "?"
stashed = "="
conflicted = "!"
deleted = "x"
renamed = "r"

[jobs]
symbol = ""
number_threshold = 1
style = "bold yellow"
format = " [&$number]($style)"

[battery]
full_symbol = ""
charging_symbol = "+"
discharging_symbol = "-"
format = " [$symbol$percentage]($style)"
[[battery.display]]
threshold = 25
style = "bold red"
[[battery.display]]
threshold = 75
style = "yellow"

[status]
disabled = false
style = "bold red"
format = " [$status]($style)"

[character]
format = " $symbol "
success_symbol = "[\\$](bold green)"
error_symbol = "[\\$](bold red)"

[cmd_duration]
disabled = true
[time]
disabled = true

# Modules de langages / cloud désactivés pour garder un prompt court.
# À réactiver au besoin (nodejs, golang, php, rust, python, docker_context, aws, gcloud, terraform…).
[nodejs]
disabled = true
[golang]
disabled = true
[php]
disabled = true
[rust]
disabled = true
[python]
disabled = true
[package]
disabled = true
[docker_context]
disabled = true
[aws]
disabled = true
[gcloud]
disabled = true
[terraform]
disabled = true
