"$schema" = 'https://starship.rs/config-schema.json'
# ~/.config/starship.toml — géré par ~/code/dotfiles.
# Approximation du thème powerline de liquidprompt utilisé auparavant :
#   [user][@hôte si ssh][chemin][git][jobs][batterie][code d'erreur]$
# Non reproduit (pas de module starship) : charge CPU, température, sessions
# détachées screen/tmux, détection de proxy.
# Les séparateurs  nécessitent une police powerline (apt fonts-powerline).

add_newline = false
command_timeout = 500

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$jobs\
$battery\
$status\
$character"""

[username]
show_always = true
style_user = "bg:#4e4e4e fg:#ffffff"
style_root = "bg:#af0000 fg:#ffffff bold"
format = "[ $user ]($style)[](fg:#4e4e4e bg:#005f87)"

[hostname]
ssh_only = true
style = "bg:#005f87 fg:#ffffff"
format = "[@$hostname ]($style)"

[directory]
style = "bg:#005f87 fg:#ffffff"
format = "[ $path ]($style)[$read_only]($read_only_style)[](fg:#005f87)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
read_only = ":"
read_only_style = "bg:#005f87 fg:#ff0000 bold"

[git_branch]
symbol = ""
style = "bg:#303030 fg:#afd700"
format = "[ $branch ]($style)"

[git_status]
style = "bg:#303030 fg:#ffaf00"
format = "[$all_status$ahead_behind ]($style)[](fg:#303030)"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↑${ahead_count}↓${behind_count}"
modified = "*"
staged = "+"
untracked = "?"
stashed = "≡"
conflicted = "!"
deleted = "✘"
renamed = "»"

[jobs]
symbol = "⚙"
number_threshold = 1
style = "bg:#5f5f00 fg:#ffffff"
format = "[ $symbol$number ]($style)"

[battery]
full_symbol = ""
charging_symbol = "⚡"
discharging_symbol = "▼"
format = "[ $symbol$percentage ]($style)"
[[battery.display]]
threshold = 25
style = "bg:#af0000 fg:#ffffff bold"
[[battery.display]]
threshold = 75
style = "bg:#5f5f00 fg:#ffff00"

[status]
disabled = false
style = "bg:#af0000 fg:#ffffff bold"
format = "[ ✘ $status ]($style)"

[character]
success_symbol = "[ \\$](bold green)"
error_symbol = "[ \\$](bold red)"

[cmd_duration]
disabled = true
[time]
disabled = true

# Modules de langages / cloud désactivés pour rester proche de liquidprompt.
# À réactiver au besoin (nodejs, golang, php, rust, python, docker_context, aws, gcloud, terraform…).
[nodejs]
disabled = true
[golang]
disabled = true
[php]
disabled = true
[rust]
disabled = true
[python]
disabled = true
[package]
disabled = true
[docker_context]
disabled = true
[aws]
disabled = true
[gcloud]
disabled = true
[terraform]
disabled = true
